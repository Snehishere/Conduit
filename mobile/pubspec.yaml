name: conduit
description: Conduit - Your devices, one web
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  cryptography: ^2.2.0
  permission_handler: ^11.0.1
  flutter_local_notifications: ^18.0.0
  provider: ^6.1.1
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  path: ^1.8.0
  shared_preferences: ^2.2.0
  record: ^7.1.1
  just_audio: ^0.9.36
  audio_session: ^0.1.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
