name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Conduit ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Conduit ${{ steps.get_version.outputs.version }}

            ### Downloads
            - **Windows**: conduit-windows.msi
            - **macOS**: conduit-macos.dmg
            - **Linux**: conduit-linux.AppImage
            - **Android**: conduit-android.apk

            ### Installation
            Download the appropriate file for your platform and install.

            ### What's Changed
            See [CHANGELOG.md](https://github.com/Snehishere/Conduit/blob/master/CHANGELOG.md) for details.

  build-desktop:
    name: Build Desktop - ${{ matrix.platform }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            name: 'linux'
          - platform: 'windows-latest'
            name: 'windows'
          - platform: 'macos-latest'
            name: 'macos'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop app
        working-directory: desktop
        run: npm run tauri build

      - name: Upload Release Asset (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: desktop/src-tauri/target/release/bundle/appimage/conduit_${{ needs.create-release.outputs.version }}_amd64.AppImage
          asset_name: conduit-linux.AppImage
          asset_content_type: application/octet-stream

      - name: Upload Release Asset (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: desktop/src-tauri/target/release/bundle/msi/conduit_${{ needs.create-release.outputs.version }}_x64_en-US.msi
          asset_name: conduit-windows.msi
          asset_content_type: application/octet-stream

      - name: Upload Release Asset (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: desktop/src-tauri/target/release/bundle/dmg/conduit_${{ needs.create-release.outputs.version }}_x64.dmg
          asset_name: conduit-macos.dmg
          asset_content_type: application/octet-stream

  build-android:
    name: Build Android APK
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: mobile/build/app/outputs/flutter-apk/app-release.apk
          asset_name: conduit-android.apk
          asset_content_type: application/vnd.android.package-archive
