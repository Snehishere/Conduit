# Conduit Relay — deployment.
#
#   cp .env.example .env   # then fill in RELAY_TOKEN and HMAC_SECRET_FILE
#   docker compose up -d --build
#
# Copy `.env` to `.secrets/hmac_secret` (host) so the master secret lives in a
# file rather than the process environment:
#   mkdir -p secrets && openssl rand -hex 32 > secrets/hmac_secret
#   chmod 600 secrets/hmac_secret
#
# No `version:` key — it is obsolete and only produces a warning on modern
# Compose.

services:
  relay:
    build:
      # Repo-root context: the relay is a Cargo workspace member and depends
      # on packages/protocol (see services/relay/Dockerfile).
      context: .
      dockerfile: services/relay/Dockerfile
    ports:
      # ${VAR:-default} keeps the published host ports configurable from .env
      # without touching this file.
      - "${RELAY_PUBLISHED_WS_PORT:-9528}:${RELAY_WS_PORT:-9528}"
      - "${RELAY_PUBLISHED_WSS_PORT:-9529}:${RELAY_WSS_PORT:-9529}"
      # Health/metrics/pin stay on loopback: they are not meant to be public.
      - "127.0.0.1:${RELAY_PUBLISHED_HEALTH_PORT:-9530}:${RELAY_HEALTH_PORT:-9530}"
    environment:
      - RUST_LOG=${RUST_LOG:-info}

      # REQUIRED. The relay reads this (as `relay_token`) and compares it
      # against what a client presents in `relay_auth`. It is NOT the signing
      # key — see RELAY_SIGNING_KEY in .env.example.
      - RELAY_TOKEN=${RELAY_TOKEN:?RELAY_TOKEN is required}

      # Fail closed on a missing master secret rather than silently generating
      # a throwaway one: a fresh secret invalidates every deployed pin/key on
      # every recreate. Leave HMAC_SECRET empty and set HMAC_SECRET_FILE so the
      # value never appears in `docker inspect` or /proc/<pid>/environ.
      - HMAC_SECRET=${HMAC_SECRET:-}
      - HMAC_SECRET_FILE=${HMAC_SECRET_FILE:-/data/secrets/hmac_secret}

      # Message-signing key. Unset => derived from the master secret with a
      # domain-separated KDF, which is the recommended setup.
      - RELAY_SIGNING_KEY=${RELAY_SIGNING_KEY:-}
      - RELAY_SIGNING_KEY_ID=${RELAY_SIGNING_KEY_ID:-}
      - RELAY_SIGNING_KEY_PREVIOUS=${RELAY_SIGNING_KEY_PREVIOUS:-}
      - RELAY_SIGNING_KEY_PREVIOUS_ID=${RELAY_SIGNING_KEY_PREVIOUS_ID:-}

      # Ports / TLS / behaviour — all documented in .env.example.
      - RELAY_WS_PORT=${RELAY_WS_PORT:-9528}
      - RELAY_WSS_PORT=${RELAY_WSS_PORT:-9529}
      - RELAY_HEALTH_PORT=${RELAY_HEALTH_PORT:-9530}
      - RELAY_ENABLE_PLAIN_WS=${RELAY_ENABLE_PLAIN_WS:-false}
      - RELAY_AUTH_TIMEOUT_SECS=${RELAY_AUTH_TIMEOUT_SECS:-10}
      - RELAY_TLS_HOSTNAME=${RELAY_TLS_HOSTNAME:-localhost}
      - RELAY_TLS_EXTRA_SANS=${RELAY_TLS_EXTRA_SANS:-}
      - RELAY_CERT_DIR=${RELAY_CERT_DIR:-/data/certs}
      - RELAY_NONCE_FILE=${RELAY_NONCE_FILE:-/data/nonces.json}
      - RELAY_HEALTH_TOKEN=${RELAY_HEALTH_TOKEN:-}
      - RELAY_METRICS_TOKEN=${RELAY_METRICS_TOKEN:-}
    volumes:
      # Every path the relay WRITES must be a volume, or the state is destroyed
      # on the next `up`, `pull` or image rebuild.
      #
      #   /data/secrets/hmac_secret  master secret          (see above)
      #   /data/nonces.json          replay-protection cache, flushed every 30 s
      #   /data/certs/{cert,key}.pem TLS material
      #
      # Losing the nonce cache is the subtle one: the cross-restart replay
      # guarantee in packages/protocol/src/lib.rs only holds while this file
      # survives. Losing it means a message captured inside the 30 s freshness
      # window can be replayed once after every restart.
      - ./secrets:/data/secrets
      - relay-nonces:/data
      - relay-certs:/data/certs
    restart: unless-stopped
    healthcheck:
      # start_period covers first boot, where the relay generates a
      # self-signed certificate (and writes the secret file) before the health
      # listener is up.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${RELAY_HEALTH_PORT:-9530}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Nonce replay cache + any other relay state written under /data.
  relay-nonces:
  # TLS certificate and key.
  relay-certs:
