[package]
name = "conduit-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Router that carries already-encrypted Conduit traffic between devices on different networks. Runs in-process inside the desktop app."

# A library, not a program. The relay is a background task owned by the desktop
# app; there is deliberately no binary target, so there is no second way to run
# it and no way to end up with two deployments disagreeing about ports, secrets
# or certificates. See `service::RelayService`.
[lib]
name = "conduit_relay"
path = "src/lib.rs"

[dev-dependencies]
serial_test = "3"

[dependencies]
conduit-protocol = { path = "../../packages/protocol" }
dirs = "7"
env_logger = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hyper = { version = "1.0", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
log = { workspace = true }
rand = "0.8"
rcgen = "0.13"
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2"
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
